name: Build Java macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java app
        run: mvn --batch-mode package
      - name: Build Apple Silicon app bundle
        run: |
          mkdir -p dist
          jpackage --type app-image --name FlightInquiry --input target --main-jar flight-inquiry-1.0.0.jar --main-class com.imguomark.flightinquiry.FlightInquiryApp --dest dist --mac-package-identifier com.imguomark.flightinquiry
          file dist/FlightInquiry.app/Contents/MacOS/FlightInquiry
      - name: Upload FlightInquiry.app
        uses: actions/upload-artifact@v4
        with:
          name: FlightInquiry-macOS-arm64
          path: dist/FlightInquiry.app
          if-no-files-found: error
