name: Build Java JAR

on:
  workflow_dispatch:
  push:
    paths:
      - "pom.xml"
      - "src/**"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and package executable JAR
        run: mvn --batch-mode package
      - name: Verify JAR
        run: jar tf target/flight-inquiry-1.0.0.jar | grep FlightInquiryApp.class
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: FlightInquiry-java-jar
          path: target/flight-inquiry-1.0.0.jar
          if-no-files-found: error
