name: Build macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          swift --version
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"
      - name: Run tests
        run: swift test
      - name: Build arm64 app bundle
        run: |
          sed -i '' 's/\r$//' scripts/build-app.sh
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh
          file FlightInquiry.app/Contents/MacOS/FlightInquiryApp
      - name: Upload FlightInquiry.app
        uses: actions/upload-artifact@v4
        with:
          name: FlightInquiry-macOS-arm64
          path: FlightInquiry.app
          if-no-files-found: error
